services:
  postgres:
    image: postgres:18.6-alpine
    # Development-only credentials; not for any shared or production environment.
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    volumes:
      # Creates the `auth` database and user on the first start of an empty volume.
      - ./docker/postgres/init-auth-db.sql:/docker-entrypoint-initdb.d/init-auth-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 2s
      retries: 15

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    environment:
      DB_HOST: postgres
      AUTH_JWKS_URI: http://auth-service:8082/.well-known/jwks.json
    depends_on:
      postgres:
        condition: service_healthy

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      TASK_SERVICE_URL: http://task-service:8081
      AUTH_SERVICE_URL: http://auth-service:8082
    ports:
      - "8080:8080"
    depends_on:
      - task-service
      - auth-service
