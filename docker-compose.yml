services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: tasks
      POSTGRES_USER: tasks
      POSTGRES_PASSWORD: tasks
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tasks -d tasks"]
      interval: 2s
      timeout: 2s
      retries: 15

  task-service:
    build:
      context: .
      dockerfile: task-service/Dockerfile
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy

  api-gateway:
    build:
      context: .
      dockerfile: api-gateway/Dockerfile
    environment:
      TASK_SERVICE_URL: http://task-service:8081
    ports:
      - "8080:8080"
    depends_on:
      - task-service
