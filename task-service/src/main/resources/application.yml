spring:
  application:
    name: task-service
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:tasks}
    username: ${DB_USER:tasks}
    password: ${DB_PASSWORD:tasks}
  # Flyway runs once at startup over a plain JDBC connection (no pool).
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:tasks}
    user: ${DB_USER:tasks}
    password: ${DB_PASSWORD:tasks}
server:
  port: 8081
springdoc:
  default-produces-media-type: application/json
auth:
  # Public keys of the auth service; only reachable inside the docker network.
  jwks-uri: ${AUTH_JWKS_URI:http://localhost:8082/.well-known/jwks.json}
  issuer: ${AUTH_ISSUER:http://auth-service:8082}
