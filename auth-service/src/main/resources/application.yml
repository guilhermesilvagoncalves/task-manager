spring:
  application:
    name: auth-service
  # Default credentials are for local development only; override with DB_USER / DB_PASSWORD.
  r2dbc:
    url: r2dbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:auth}
    username: ${DB_USER:auth}
    password: ${DB_PASSWORD:auth}
  # Flyway runs once at startup over a plain JDBC connection (no pool).
  flyway:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/${DB_NAME:auth}
    user: ${DB_USER:auth}
    password: ${DB_PASSWORD:auth}
server:
  port: 8082
springdoc:
  default-produces-media-type: application/json
auth:
  issuer: http://auth-service:8082
